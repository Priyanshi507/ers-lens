# The 2026 model car under the ratified 2027 power unit rules (research log, 2026-11-13).
# Sources: FIA 2027 F1 Regulations, Section C (Technical) Issue 04, 19 October 2026 (C5.2.3, C5.2.7,
# C5.2.8, C5.2.9, C5.2.10); Formula 1, "Agreement reached on proposed F1 regulatory changes for 2027
# and 2028" (ICE 420 kW, MGU-K 300 kW, harvesting 375 kW). Everything else, including drag, is the
# 2026 model car: the 2027 aerodynamic changes are not modelled.
# Not public: the speed-dependent deployment curves of FIA-F1-DOC-111 that C5.2.8 refers to. The
# taper below is the 2026 formula (300 kW from 300 km/h); scripts/forecast_2027.py replaces
# taper_a1_w with each member of a family of curves, so no single guess carries a result.
car:
  mass_kg: 768.0              # minimum mass incl. driver
  fuel_kg: 70.0               # race-start fuel load (estimate)
  fuel_per_lap_kg: 1.3
  cda_straight: 0.95          # active aero straight mode (estimate)
  cda_corner: 1.35            # active aero corner mode (estimate)
  crr: 0.012
  rho: 1.20
  ice_power_w: 420000.0       # 2026 model value +20 kW (fuel energy flow 3150 MJ/h, +5%, C5.2.3)
  mguk_power_w: 375000.0      # absolute ERS-K power, C5.2.7; limits harvesting
  deploy_max_w: 300000.0      # propulsion without Overtake in the race, C5.2.8 ii
  # MGU-K power vs speed (v in km/h). Confirmed in the FIA 2026 Power Unit Technical
  # Regulations, Issue 6 (29 March 2024); later issues not checked.
  # Below the knee: 1800 - 5v kW (capped at 350, so full power up to 290 km/h).
  # Knee to zero: 6900 - 20v kW (100 kW at 340 km/h, zero at 345 km/h).
  taper_a1_w: 1800000.0
  taper_b1_w_per_kmh: 5000.0
  taper_knee_kmh: 340.0
  taper_a2_w: 6900000.0
  taper_b2_w_per_kmh: 20000.0
  mguk_ramp_w_per_s: 50000.0  # secondary source only; real data reject it for clipping
  es_capacity_j: 4500000.0    # state-of-charge window, C5.2.9
  harvest_per_lap_j: 8500000.0  # VERIFY (press quotes 8.5-9 MJ)
  eta_harvest: 0.90
  eta_deploy: 0.95
  traction_max_n: 14000.0
  brake_g_low: 1.8
  brake_g_high: 5.0
  brake_v_ref_ms: 83.0
