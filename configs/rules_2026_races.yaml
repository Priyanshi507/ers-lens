# Event energy rules, overriding configs/car_2026.yaml for the Strategy Lab and calibration.
# Recharge limits re-checked 2026-10-18 against per-session FIA figures; the 2026-10-07 version
# used 9 MJ for every race, which is the limit with Overtake mode active, not without it.
#
# Sources:
#  [1] RaceFans, "FIA confirms lowest energy recharge limit yet for qualifying at Montreal"
#      (21 May 2026), table of per-lap recharge limits by session for the first five events:
#      qualifying  Albert Park 7, Shanghai 9, Suzuka 8, Miami 8, Montreal 6 MJ;
#      race        8 / 8.5 / 8.5 / 8.5 / 8 MJ without Overtake, +0.5 MJ with it.
#  [2] Autosport, "FIA cuts recoverable energy in F1 qualifying to stop extreme tactics"
#      (Melbourne): qualifying 8.5 -> 7 MJ, race 8.5 -> 8 MJ, 8.5 MJ with Overtake.
#  [3] RaceFans, "Drivers allowed higher power unit recharge limit for Chinese Grand Prix"
#      (12 March 2026): Shanghai race 8.5 MJ (9 with Overtake), qualifying 9 MJ.
#  [4] PlanetF1, "FIA clarifies F1 2026 rule confusion over Miami GP energy recharge limits"
#      (1 May 2026): Miami qualifying 8 MJ, race 8.5 MJ (9 with Overtake).
#  [5] PlanetF1, "FIA confirms changes to F1 2026 rules for Miami Grand Prix" (FIA statement):
#      peak superclip power 350 kW from Miami, previously 250 kW.
#  [6] Yahoo Sports / Motorsport, "FIA confirms 2026 F1 rule changes ahead of Miami Grand Prix":
#      from Miami, MGU-K deployment 350 kW in key acceleration zones, 250 kW elsewhere. Modelled
#      only as an extreme-case bound (250 kW everywhere). Each race's FIA Power Unit Information
#      document lists sectors and MGU-K power curves (article C5.2.8); which of its sectors are
#      these zones is not yet checked against the documents themselves (research log, 2026-11-03).
#  [7] FIA, "Power Unit Information" document for each event (Race Director, fia.com decision
#      documents), table "Maximum Recharge per lap": Race (Overtake not active), Race (Overtake
#      active), Qualifying, Free Practice, Out laps. PDFs read 2026-11-03 for Canada, Austria,
#      Britain, Belgium, Italy, Spain, Azerbaijan and Bahrain (Sepang); for Japan, Monaco,
#      Barcelona, Hungary, Netherlands, Singapore and United States the documents' text as
#      returned by web search, PDFs not read. Every press value above agrees with [7].
# Overtake mode (+0.5 MJ while active) is not modelled; the race values are without it.
# Super-clip cap: 250 kW for the three events before Miami, 350 kW from Miami [5].

events:
  Australia:
    harvest_per_lap_j: 8.0e6     # [1] [2]
    superclip_max_w: 250000.0    # [5] before Miami
  China:
    harvest_per_lap_j: 8.5e6     # [1] [3]
    superclip_max_w: 250000.0    # [5]
  Miami:
    harvest_per_lap_j: 8.5e6     # [1] [4]
    superclip_max_w: 350000.0    # [5]
  Canada:
    harvest_per_lap_j: 8.0e6     # [1]
    superclip_max_w: 350000.0    # [5]
  Japan:
    harvest_per_lap_j: 8.5e6     # [1] [7] text
    superclip_max_w: 250000.0
  Austria:
    harvest_per_lap_j: 8.0e6     # [7]
    superclip_max_w: 350000.0
  Belgium:
    harvest_per_lap_j: 8.5e6     # [7]
    superclip_max_w: 350000.0
  Monaco Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] text
    superclip_max_w: 350000.0
  Barcelona Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] text
    superclip_max_w: 350000.0
  British Grand Prix:
    harvest_per_lap_j: 8.0e6     # [7]
    superclip_max_w: 350000.0
  Hungarian Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] text
    superclip_max_w: 350000.0
  Dutch Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] text
    superclip_max_w: 350000.0
  Italian Grand Prix:
    harvest_per_lap_j: 7.0e6     # [7]
    superclip_max_w: 350000.0
  Spanish Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] (Madrid, V2)
    superclip_max_w: 350000.0
  Azerbaijan Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7]
    superclip_max_w: 350000.0
  Bahrain Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] (held at Sepang)
    superclip_max_w: 350000.0
  Singapore Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] text
    superclip_max_w: 350000.0
  United States Grand Prix:
    harvest_per_lap_j: 8.5e6     # [7] text
    superclip_max_w: 350000.0

# Qualifying recharge limit per lap; every other rule as in the race entry above.
qualifying:
  Australia: 7.0e6               # [1] [2]
  China: 9.0e6                   # [1] [3]
  Miami: 8.0e6                   # [1] [4]
  Canada: 6.0e6                  # [1] [7]
  Japan: 8.0e6
  Austria: 6.0e6
  Belgium: 7.0e6
  Monaco Grand Prix: 9.0e6
  Barcelona Grand Prix: 7.0e6
  British Grand Prix: 6.5e6
  Hungarian Grand Prix: 9.0e6
  Dutch Grand Prix: 7.5e6
  Italian Grand Prix: 5.0e6
  Spanish Grand Prix: 7.5e6
  Azerbaijan Grand Prix: 8.5e6
  Bahrain Grand Prix: 7.5e6
  Singapore Grand Prix: 9.0e6
  United States Grand Prix: 8.5e6

sensitivity:
  harvest_low_j: 8.0e6           # kept from 2026-10-07 so earlier runs stay comparable
  deploy_outside_zones_w: 250000.0  # [6] extreme case, Miami and later only
